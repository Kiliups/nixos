set -g mouse on
set -g extended-keys on
set -gq extended-keys-format csi-u

# allow terminal to handle mouse events (for clicking links)
set -g terminal-features '*:hyperlinks'

# set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
# Enable xterm keys for better compatibility with modern terminal emulators
setw -g xterm-keys on

# copy mode improvements
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# split panes with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
